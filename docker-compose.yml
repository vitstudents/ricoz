version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ledgerai-backend
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=LedgerAI – Continuous Bank Reconciliation & Bookkeeping Agent
      - DATABASE_URL=sqlite:///./ledgerai.db
      - SECRET_KEY=ledgerai-production-super-secure-key-32chars!
      - CORS_ORIGINS=["*"]
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ledgerai-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

