<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LedgerAI Mobile</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app" class="mobile-container">
    <!-- Mobile Header -->
    <header class="app-header">
      <div class="header-brand">
        <div class="logo-box">⚖️</div>
        <div>
          <div class="brand-title">Ledger<span>AI</span> <span class="badge">Mobile</span></div>
          <div class="brand-sub">Autonomous Continuous Bookkeeper</div>
        </div>
      </div>
      <button id="btnBiometric" class="btn-icon" title="CPA Biometric Approval">🔒</button>
    </header>

    <!-- Main Dynamic Container -->
    <main id="mainContent" class="content-scroll">
      <!-- Injected via JavaScript -->
    </main>

    <!-- Mobile Bottom Navigation -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="overview">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Overview</span>
      </button>
      <button class="nav-item" data-tab="transactions">
        <span class="nav-icon">💳</span>
        <span class="nav-label">Feed</span>
      </button>
      <button class="nav-item" data-tab="reconciliation">
        <span class="nav-icon">⚖️</span>
        <span class="nav-label">Reconcile</span>
      </button>
      <button class="nav-item" data-tab="anomalies">
        <span class="nav-icon">🚨</span>
        <span class="nav-label">Anomalies</span>
        <span id="anomalyBadge" class="nav-badge">3</span>
      </button>
      <button class="nav-item" data-tab="assistant">
        <span class="nav-icon">🤖</span>
        <span class="nav-label">Copilot</span>
      </button>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
